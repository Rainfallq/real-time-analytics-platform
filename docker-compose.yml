name: rtap

x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://rtap_user:${POSTGRES_PASSWORD:-rtap_dev_password}@postgres:5432/analytics
  KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
  SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
  ENVIRONMENT: development
  DEBUG: "false"
  SQL_ECHO: "false"
  INGEST_MODE: ${INGEST_MODE:-outbox}
  DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-20}

x-app-build: &app-build
  build:
    context: .
    dockerfile: infrastructure/docker/Dockerfile

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: rtap_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rtap_dev_password}
      POSTGRES_DB: analytics
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rtap_user -d analytics"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.3.1
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --rpc-addr
      - redpanda:33145
      - --advertise-rpc-addr
      - redpanda:33145
      - --mode
      - dev-container
      - --smp
      - "1"
      - --default-log-level=info
    ports:
      - "19092:19092"
      - "19644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v26.3.1
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        rpk topic create raw-data -p 6 -r 1 -X brokers=redpanda:9092 || true
        rpk topic create raw-data.dlq -p 1 -r 1 -X brokers=redpanda:9092 || true
        rpk topic create processed-data -p 6 -r 1 -X brokers=redpanda:9092 || true
        rpk topic create alerts -p 3 -r 1 -X brokers=redpanda:9092 || true
    restart: "no"

  migrate:
    <<: *app-build
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app-build
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *app-env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/alive').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  publisher:
    <<: *app-build
    command: ["python", "-m", "workers.outbox_publisher"]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redpanda-init:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    <<: *app-build
    command: ["python", "-m", "workers.transaction_worker"]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redpanda-init:
        condition: service_completed_successfully
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  redpanda_data:
