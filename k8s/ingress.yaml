apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rtap
  namespace: rtap
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
spec:
  ingressClassName: nginx
  rules:
    - host: rtap.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: rtap-api, port: {name: http}}
