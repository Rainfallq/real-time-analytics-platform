global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # every pod with the annotation prometheus.io/scrape: "true"
  - job_name: rtap-pods
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [rtap]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      # job label is the app label without the rtap- prefix: api, publisher, worker
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: rtap-(.*)
        target_label: job
        replacement: $1
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: ["redpanda-0.redpanda.rtap.svc.cluster.local:9644"]
