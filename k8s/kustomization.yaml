apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rtap
resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - redpanda.yaml
  - migrate-job.yaml
  - api.yaml
  - publisher.yaml
  - worker.yaml
  - ingress.yaml
  - monitoring.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: prometheus-config
    files:
      - monitoring/prometheus.yml
      - monitoring/alerts.yml
  - name: grafana-datasource
    files:
      - prometheus.yml=monitoring/grafana-datasource.yml
  - name: grafana-dashboard-provider
    files:
      - dashboards.yml=monitoring/grafana-dashboard-provider.yml
  - name: grafana-dashboards
    files:
      - monitoring/rtap-overview.json
