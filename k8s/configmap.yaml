apiVersion: v1
kind: ConfigMap
metadata:
  name: rtap-config
  namespace: rtap
data:
  ENVIRONMENT: "production"
  DEBUG: "false"
  SQL_ECHO: "false"
  INGEST_MODE: "outbox"
  DATABASE_POOL_SIZE: "20"
  DATABASE_MAX_OVERFLOW: "0"
  KAFKA_BOOTSTRAP_SERVERS: "redpanda:9092"
  KAFKA_TOPIC_RAW_DATA: "raw-data"
  KAFKA_TOPIC_DLQ: "raw-data.dlq"
  LOG_LEVEL: "INFO"
