apiVersion: batch/v1
kind: Job
metadata:
  name: rtap-migrate
  namespace: rtap
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: rtap-app:latest
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: {name: rtap-config}
            - secretRef: {name: rtap-secret}
