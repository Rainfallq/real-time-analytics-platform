apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: rtap
spec:
  clusterIP: None
  selector: {app: redpanda}
  ports:
    - {name: kafka, port: 9092, targetPort: 9092}
    - {name: admin, port: 9644, targetPort: 9644}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  namespace: rtap
spec:
  serviceName: redpanda
  replicas: 1
  selector:
    matchLabels: {app: redpanda}
  template:
    metadata:
      labels: {app: redpanda}
    spec:
      containers:
        - name: redpanda
          image: docker.redpanda.com/redpandadata/redpanda:v26.3.1
          args:
            - redpanda
            - start
            - --kafka-addr=internal://0.0.0.0:9092
            - --advertise-kafka-addr=internal://redpanda-0.redpanda.rtap.svc.cluster.local:9092
            - --rpc-addr=0.0.0.0:33145
            - --advertise-rpc-addr=redpanda-0.redpanda.rtap.svc.cluster.local:33145
            - --mode=dev-container
            - --smp=1
            - --memory=512M
            - --default-log-level=info
          ports:
            - {containerPort: 9092}
            - {containerPort: 9644}
          readinessProbe:
            httpGet: {path: /v1/status/ready, port: 9644}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 250m, memory: 768Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/redpanda/data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: {storage: 10Gi}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: redpanda-init
  namespace: rtap
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: docker.redpanda.com/redpandadata/redpanda:v26.3.1
          command: ["/bin/bash", "-c"]
          args:
            - |
              until rpk cluster health -X brokers=redpanda-0.redpanda:9092 -X admin.hosts=redpanda-0.redpanda:9644 | grep -q 'Healthy:.*true'; do sleep 3; done
              rpk topic create raw-data -p 6 -r 1 -X brokers=redpanda-0.redpanda:9092 || true
              rpk topic create raw-data.dlq -p 1 -r 1 -X brokers=redpanda-0.redpanda:9092 || true
              rpk topic create processed-data -p 6 -r 1 -X brokers=redpanda-0.redpanda:9092 || true
              rpk topic create alerts -p 3 -r 1 -X brokers=redpanda-0.redpanda:9092 || true
