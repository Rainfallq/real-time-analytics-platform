name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install ruff
      # syntax errors and undefined names only, style rules are not enforced yet
      - run: ruff check backend --select E9,F63,F7,F82

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: pip install -r backend/requirements.txt aiosqlite pytest-cov
      - name: Unit and integration tests (SQLite)
        working-directory: backend
        run: python -m pytest -q --cov=app --cov-report=term --cov-fail-under=70

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Validate Kubernetes manifests
        run: kubectl kustomize k8s | kubeconform -strict -summary -ignore-missing-schemas
      - name: Validate docker-compose file
        run: docker compose config -q

  image:
    runs-on: ubuntu-latest
    needs: [lint, test, manifests]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile
          push: false
          tags: rtap-app:${{ github.sha }}
          load: true
      - name: Smoke test
        run: |
          docker run --rm rtap-app:${{ github.sha }} python -c "import app.main"
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile
          push: true
          tags: ghcr.io/rainfallq/rtap-app:${{ github.sha }},ghcr.io/rainfallq/rtap-app:latest
